<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quran Reading Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f7a5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quran Tracker">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1d2a24;--mute:#6b7a72;--line:#e3e0d6;--green:#1f7a5a;--green2:#cfe9dd;--gold:#d99a1e;--gold2:#f8e7bd;--un:#ebe8de}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--card:#1b2420;--ink:#e8efe9;--mute:#93a39a;--line:#2b3731;--green:#3fb589;--green2:#1f4a3a;--gold:#e8b44a;--gold2:#4d3b14;--un:#27322c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:14px 14px 60px;max-width:640px;margin:0 auto}
h1{font-size:18px;margin:0 0 2px}
.sub{color:var(--mute);font-size:13px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.top{display:flex;gap:14px;align-items:center}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px}
.ring b small{font-size:11px;color:var(--mute);font-weight:400}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;flex:1}
.stats div{font-size:12px;color:var(--mute)}
.stats strong{display:block;font-size:17px;color:var(--ink)}
.next{display:flex;flex-direction:column;gap:10px}
.btn{border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;background:var(--green);color:#fff;width:100%}
.btn.sec{background:var(--un);color:var(--ink);font-size:14px;padding:10px}
.btn:active{opacity:.8}
.row{display:flex;gap:8px}
input[type=number]{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font-size:16px}
.lbl{font-size:12px;color:var(--mute)}
.tabs{display:flex;gap:6px;margin:4px 0 12px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
.tabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px;border-radius:10px;font-size:14px}
.tabs button.on{background:var(--green);color:#fff;border-color:var(--green)}
.chips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:20px;padding:6px 12px;font-size:13px}
.chips button.on{background:var(--gold2);border-color:var(--gold)}
.day{border-top:1px solid var(--line);padding:10px 0}
.day:first-child{border-top:0}
.day .d{font-weight:600}
.day .p{color:var(--green)}
.day .s{color:var(--mute);font-size:13px}
.sum{display:flex;gap:10px;margin-bottom:10px}
.sum div{flex:1;background:var(--bg);border-radius:12px;padding:10px;text-align:center;font-size:12px;color:var(--mute)}
.sum strong{display:block;font-size:20px;color:var(--ink)}
.juz h3{margin:14px 0 6px;font-size:13px;display:flex;justify-content:space-between;color:var(--mute);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:5px}
.cell{aspect-ratio:1;border-radius:8px;background:var(--un);border:0;color:var(--mute);font-size:12px;padding:0}
.cell.r{background:var(--green2);color:var(--green);font-weight:600}
.cell.t{background:var(--gold);color:#fff;font-weight:700}
.cell.n{outline:2px solid var(--green)}
.bar{height:8px;background:var(--un);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.srow{padding:8px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .h{display:flex;justify-content:space-between;margin-bottom:4px;font-size:14px}
.srow .h span:last-child{color:var(--mute);font-size:12px}
.toast{position:fixed;left:14px;right:14px;bottom:14px;max-width:612px;margin:auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;z-index:9}
.toast button{background:none;border:0;color:var(--gold);font-weight:700;font-size:15px}
.hide{display:none}
.mut{color:var(--mute);font-size:12px}
</style>
</head>
<body>
<h1>📖 Quran Reading Tracker</h1>
<div class="sub" id="sub"></div>

<div class="card top">
  <div class="ring"><svg width="104" height="104" viewBox="0 0 104 104"><circle cx="52" cy="52" r="44" fill="none" stroke="var(--un)" stroke-width="10"/><circle id="arc" cx="52" cy="52" r="44" fill="none" stroke="var(--green)" stroke-width="10" stroke-linecap="round" stroke-dasharray="276.46" stroke-dashoffset="276.46"/></svg><b id="pct">0%<small>of 604</small></b></div>
  <div class="stats" id="stats"></div>
</div>

<div class="card next" id="nextCard"></div>

<div class="card" id="goalCard"></div>

<div class="tabs" id="tabs">
  <button data-t="recap" class="on">Recap</button>
  <button data-t="pages">Pages</button>
  <button data-t="surah">Surah</button>
  <button data-t="backup">Backup</button>
</div>

<div id="recap"></div>
<div id="pages" class="hide"></div>
<div id="surah" class="hide"></div>
<div id="backup" class="hide"></div>

<div id="toast" class="toast hide"></div>

<script>
const NAMES="Al-Fatihah,Al-Baqarah,Ali 'Imran,An-Nisa',Al-Ma'idah,Al-An'am,Al-A'raf,Al-Anfal,At-Taubah,Yunus,Hud,Yusuf,Ar-Ra'd,Ibrahim,Al-Hijr,An-Nahl,Al-Isra',Al-Kahf,Maryam,Taha,Al-Anbiya',Al-Hajj,Al-Mu'minun,An-Nur,Al-Furqan,Ash-Shu'ara',An-Naml,Al-Qasas,Al-'Ankabut,Ar-Rum,Luqman,As-Sajdah,Al-Ahzab,Saba',Fatir,Ya-Sin,As-Saffat,Sad,Az-Zumar,Ghafir,Fussilat,Ash-Shura,Az-Zukhruf,Ad-Dukhan,Al-Jathiyah,Al-Ahqaf,Muhammad,Al-Fath,Al-Hujurat,Qaf,Adh-Dhariyat,At-Tur,An-Najm,Al-Qamar,Ar-Rahman,Al-Waqi'ah,Al-Hadid,Al-Mujadilah,Al-Hashr,Al-Mumtahanah,As-Saff,Al-Jumu'ah,Al-Munafiqun,At-Taghabun,At-Talaq,At-Tahrim,Al-Mulk,Al-Qalam,Al-Haqqah,Al-Ma'arij,Nuh,Al-Jinn,Al-Muzzammil,Al-Muddaththir,Al-Qiyamah,Al-Insan,Al-Mursalat,An-Naba',An-Nazi'at,'Abasa,At-Takwir,Al-Infitar,Al-Mutaffifin,Al-Inshiqaq,Al-Buruj,At-Tariq,Al-A'la,Al-Ghashiyah,Al-Fajr,Al-Balad,Ash-Shams,Al-Layl,Ad-Duha,Ash-Sharh,At-Tin,Al-'Alaq,Al-Qadr,Al-Bayyinah,Az-Zalzalah,Al-'Adiyat,Al-Qari'ah,At-Takathur,Al-'Asr,Al-Humazah,Al-Fil,Quraysh,Al-Ma'un,Al-Kawthar,Al-Kafirun,An-Nasr,Al-Masad,Al-Ikhlas,Al-Falaq,An-Nas".split(",");
const START=[0,1,2,50,77,106,128,151,177,187,208,221,235,249,255,262,267,282,293,305,312,322,332,342,350,359,367,377,385,396,404,411,415,418,428,434,440,446,453,458,467,477,483,489,496,499,502,507,511,515,518,520,523,526,528,531,534,537,542,545,549,551,553,554,556,558,560,562,564,566,568,570,572,574,575,577,578,580,582,583,585,586,587,587,589,590,591,591,592,593,594,595,595,596,596,597,597,598,598,599,599,600,600,601,601,601,602,602,602,603,603,603,604,604,604];
const END=s=>s===114?604:Math.max(START[s],START[s+1]-1);
const juzRange=j=>[j===1?1:20*(j-1)+2, j===30?604:20*j+1];
const KEY="quran-tracker-v1";
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const addDays=(s,n)=>{const [y,m,d]=s.split("-").map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate())};
const fmt=s=>{if(s==="0")return"Before tracking";const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"})};

let S; // array 0..604; null unread, "0" baseline, else date
function defaults(){const a=Array(605).fill(null);for(let p=1;p<=575;p++)a[p]="0";return a}
let G={days:28,start:today()};
let prev=null, tab="recap", period="all", saveT=null, dbDoc=null;

function surahsOn(p){const r=[];for(let s=1;s<=114;s++)if(p>=START[s]&&p<=END(s))r.push(s);return r}
function runs(ps){ps=[...ps].sort((a,b)=>a-b);const o=[];let a=null,b=null;for(const p of ps){if(a===null){a=b=p}else if(p===b+1){b=p}else{o.push([a,b]);a=b=p}}if(a!==null)o.push([a,b]);return o}
const runTxt=r=>r.map(([a,b])=>a===b?""+a:a+"–"+b).join(", ");
function surahTxt(ps){const set=[];ps.forEach(p=>surahsOn(p).forEach(s=>{if(!set.includes(s))set.push(s)}));set.sort((a,b)=>a-b);if(!set.length)return"";const nm=s=>s+". "+NAMES[s-1];if(set.length<=3)return set.map(nm).join(" → ");return nm(set[0])+" → "+nm(set[set.length-1])+" ("+set.length+" surahs)"}
const readPages=()=>{const r=[];for(let p=1;p<=604;p++)if(S[p])r.push(p);return r};
const nextUnread=()=>{for(let p=1;p<=604;p++)if(!S[p])return p;return null};

function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(KEY+"-goal",JSON.stringify(G))}catch(e){}
  if(!dbDoc)return;
  clearTimeout(saveT);
  saveT=setTimeout(()=>{dbDoc.set({pages:JSON.stringify(S),goal:JSON.stringify(G),updated:Date.now()}).catch(()=>{})},700);
}
function snap(){prev={S:S.slice(),G:JSON.stringify(G)}}
function mark(a,b){snap();const t=today();for(let p=a;p<=b;p++)if(!S[p])S[p]=t;save();render();toast("Marked pages "+(a===b?a:a+"–"+b)+" as read")}
function toggle(p){snap();S[p]=S[p]?null:today();save();render()}
function undo(){if(!prev)return;S=prev.S;G=JSON.parse(prev.G);prev=null;save();render();hideToast()}
let toastT;
function toast(msg){const el=document.getElementById("toast");el.innerHTML="<span>"+msg+"</span><button id='u'>Undo</button>";el.classList.remove("hide");document.getElementById("u").onclick=undo;clearTimeout(toastT);toastT=setTimeout(hideToast,6000)}
function hideToast(){document.getElementById("toast").classList.add("hide")}

function streak(){const days=new Set(S.filter(v=>v&&v!=="0"));let t=today();if(!days.has(t))t=addDays(t,-1);let n=0;while(days.has(t)){n++;t=addDays(t,-1)}return n}

function renderTop(){
  const n=readPages().length, left=604-n, pct=n/604*100;
  document.getElementById("arc").style.strokeDashoffset=276.46*(1-n/604);
  document.getElementById("pct").innerHTML=pct.toFixed(1)+"%<small>"+n+" / 604</small>";
  const tracked=S.filter(v=>v&&v!=="0");const days=new Set(tracked);
  const since=addDays(today(),-6);const last7=tracked.filter(d=>d>=since).length;const avg=last7/7;
  let eta="–";if(left===0)eta="Khatam 🎉";else if(avg>0){const d=Math.ceil(left/avg);const dt=new Date();dt.setDate(dt.getDate()+d);eta=dt.toLocaleDateString(undefined,{day:"numeric",month:"short"})}
  document.getElementById("stats").innerHTML=
   `<div>Remaining<strong>${left} pages</strong></div><div>Streak<strong>${streak()} day${streak()===1?"":"s"}</strong></div><div>Avg / day (7d)<strong>${avg.toFixed(1)}</strong></div><div>Est. finish<strong>${eta}</strong></div>`;
  const rp=readPages();const lastP=rp.length?Math.max(...rp):0;
  document.getElementById("sub").textContent=lastP?"Last page read: "+lastP+" · "+surahTxt([lastP]):"";
}
function renderNext(){
  const el=document.getElementById("nextCard"),p=nextUnread();
  if(!p){el.innerHTML="<b>Alhamdulillah — all 604 pages read.</b>";return}
  el.innerHTML=`<div class="lbl">Next page</div><div style="font-size:22px;font-weight:700">Page ${p}</div><div class="mut">${surahTxt([p])} · Juz ${juzOf(p)}</div>
  <button class="btn" id="fin">✓ Finished page ${p}</button>
  <div class="row"><input id="upto" type="number" min="${p}" max="604" inputmode="numeric" placeholder="Finished up to page…"><button class="btn sec" id="go" style="width:auto">Mark</button></div>`;
  document.getElementById("fin").onclick=()=>mark(p,p);
  document.getElementById("go").onclick=()=>{const v=parseInt(document.getElementById("upto").value);if(v>=p&&v<=604)mark(p,v)};
}
const juzOf=p=>{for(let j=1;j<=30;j++){const [a,b]=juzRange(j);if(p>=a&&p<=b)return j}};

function renderRecap(){
  const el=document.getElementById("recap");
  const by={};S.forEach((v,p)=>{if(p&&v){(by[v]=by[v]||[]).push(p)}});
  let dates=Object.keys(by).filter(d=>d!=="0").sort().reverse();
  const t=today();
  const lo=period==="today"?t:period==="7"?addDays(t,-6):period==="30"?addDays(t,-29):"0000";
  const shown=dates.filter(d=>d>=lo);
  const total=shown.reduce((a,d)=>a+by[d].length,0);
  const allPs=shown.flatMap(d=>by[d]);
  let h=`<div class="card"><div class="chips">${[["today","Today"],["7","7 days"],["30","30 days"],["all","All"]].map(([k,l])=>`<button data-p="${k}" class="${period===k?"on":""}">${l}</button>`).join("")}</div>
  <div class="sum"><div><strong>${total}</strong>pages</div><div><strong>${shown.length}</strong>days</div><div><strong>${(total/Math.max(1,period==="today"?1:period==="7"?7:period==="30"?30:shown.length)).toFixed(1)}</strong>pages/day</div></div>`;
  if(total)h+=`<div class="mut" style="margin-bottom:6px">Covered: <b style="color:var(--ink)">${runTxt(runs(allPs))}</b><br>${surahTxt(allPs)}</div>`;
  else h+=`<div class="mut">No pages logged in this period.</div>`;
  h+=`</div><div class="card">`;
  if(!dates.length)h+=`<div class="mut">No sessions yet — tap “Finished page” above after you read.</div>`;
  dates.slice(0,60).forEach(d=>{const ps=by[d];h+=`<div class="day"><div class="d">${d===t?"Today":fmt(d)} <span class="mut">· ${ps.length} page${ps.length>1?"s":""}</span></div><div class="p">Pages ${runTxt(runs(ps))}</div><div class="s">${surahTxt(ps)}</div></div>`});
  if(by["0"]){const ps=by["0"];h+=`<div class="day"><div class="d">Before tracking <span class="mut">· ${ps.length} pages</span></div><div class="p">Pages ${runTxt(runs(ps))}</div><div class="s">${surahTxt(ps)}</div></div>`}
  h+=`</div>`;
  el.innerHTML=h;
  el.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{period=b.dataset.p;renderRecap()});
}
function renderPages(){
  const el=document.getElementById("pages"),n=nextUnread(),t=today();let h=`<div class="mut" style="margin-bottom:4px">Tap a page to mark / unmark. Gold = read today. Outlined = next.</div><div class="juz">`;
  for(let j=1;j<=30;j++){const [a,b]=juzRange(j);let c=0;for(let p=a;p<=b;p++)if(S[p])c++;
    h+=`<h3><span>Juz ${j}</span><span>${c}/${b-a+1}</span></h3><div class="grid">`;
    for(let p=a;p<=b;p++){const cls=S[p]===t?"t":S[p]?"r":"";h+=`<button class="cell ${cls} ${p===n?"n":""}" data-p="${p}">${p}</button>`}
    h+=`</div>`}
  el.innerHTML=h+"</div>";
  el.querySelectorAll(".cell").forEach(b=>b.onclick=()=>toggle(+b.dataset.p));
}
function renderSurah(){
  let h=`<div class="card">`;
  for(let s=1;s<=114;s++){const a=START[s],b=END(s);let c=0;for(let p=a;p<=b;p++)if(S[p])c++;const tot=b-a+1,pc=c/tot*100;
    h+=`<div class="srow"><div class="h"><span>${s}. ${NAMES[s-1]} ${c===tot?"✅":""}</span><span>Juz ${juzOf(a)}${juzOf(b)!==juzOf(a)?"–"+juzOf(b):""} · p.${a}${b>a?"–"+b:""} · ${c}/${tot}</span></div><div class="bar"><i style="width:${pc}%"></i></div></div>`}
  document.getElementById("surah").innerHTML=h+"</div>";
}
function renderBackup(){
  const el=document.getElementById("backup");
  if(el.dataset.ready)return;el.dataset.ready=1;
  el.innerHTML=`<div class="card"><b>Backup &amp; restore</b><div class="mut" style="margin:6px 0 10px">Export your progress as text and keep it safe (Notes, WhatsApp to yourself). Paste it back and tap Import to restore, or to move to another phone.</div>
  <textarea id="bk" rows="6" style="width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font:12px monospace" placeholder="Export fills this box. To restore, paste your backup here."></textarea>
  <div class="row" style="margin-top:8px"><button class="btn" id="ex">Export</button><button class="btn sec" id="im">Import</button></div>
  <div class="mut" id="bkm" style="margin-top:8px"></div></div>`;
  const ta=document.getElementById("bk"),m=document.getElementById("bkm");
  document.getElementById("ex").onclick=async()=>{
    ta.value=JSON.stringify({app:"quran-tracker",v:1,pages:S,goal:G});ta.focus();ta.select();
    let ok=false;try{await navigator.clipboard.writeText(ta.value);ok=true}catch(e){}
    m.textContent=ok?"Copied to clipboard. Paste it somewhere safe.":"Select all in the box and copy it manually."};
  document.getElementById("im").onclick=()=>{
    try{const v=JSON.parse(ta.value);const a=v&&v.pages;
      if(!Array.isArray(a)||a.length!==605)throw 0;
      snap();S=a;if(v.goal&&v.goal.days>0&&v.goal.start)G=v.goal;save();render();m.textContent="Imported: "+readPages().length+" pages restored."}
    catch(e){m.textContent="That doesn't look like a valid backup."}};
}
let nkArm=false;
const dayNum=s=>{const [y,m,d]=s.split("-").map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
function renderGoal(){
  const el=document.getElementById("goalCard"),t=today();
  const left=604-readPages().length,doneToday=S.filter(v=>v===t).length;
  const elapsed=Math.max(0,dayNum(t)-dayNum(G.start)),daysLeft=G.days-elapsed;
  const deadline=addDays(G.start,G.days-1);
  let body;
  if(left===0)body=`<b>🎉 Khatam! Alhamdulillah.</b>`;
  else if(daysLeft<=0)body=`<b style="color:var(--gold)">Goal date passed</b> · ${left} pages left. Set a new goal below.`;
  else{
    const startOfDay=left+doneToday,target=Math.ceil(startOfDay/daysLeft),todo=Math.max(0,target-doneToday);
    const from=nextUnread();
    body=`<div style="font-size:13px;color:var(--mute)">Finish by <b style="color:var(--ink)">${fmt(deadline)}</b> · ${daysLeft} day${daysLeft>1?"s":""} left</div>
    <div style="font-size:20px;font-weight:700;margin:4px 0">${todo>0?"Today: "+todo+" more page"+(todo>1?"s":"")+(from?" (from page "+from+")":""):"✅ Today's target done"}</div>
    <div class="mut">Target ${target} page${target>1?"s":""}/day · read today ${doneToday}</div>
    <div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,doneToday/target*100)}%"></i></div>`;
  }
  el.innerHTML=`<div class="lbl" style="margin-bottom:4px">🎯 Goal</div>${body}
  <div class="row" style="margin-top:10px;align-items:center"><span class="mut">Finish in</span><input id="gd" type="number" min="1" max="365" value="${G.days}" inputmode="numeric"><span class="mut">days</span><button class="btn sec" id="gs" style="width:auto">Set from today</button></div>
  <button class="btn sec" id="nk" style="margin-top:8px">${nkArm?"Tap again to confirm: start new khatam":"🔄 Start new khatam"+(G.k&&G.k.length?" (#"+(G.k.length+2)+")":"")}</button>
  <div class="mut" style="margin-top:6px">Current: Khatam #${(G.k?G.k.length:0)+1}${G.k&&G.k.length?" · finished before: "+G.k.map(k=>"#"+k.n+" ("+k.pages+" pp, "+k.ended+")").join(", "):""}</div>`;
  document.getElementById("nk").onclick=()=>{
    if(!nkArm){nkArm=true;renderGoal();setTimeout(()=>{if(nkArm){nkArm=false;renderGoal()}},5000);return}
    nkArm=false;snap();const k=G.k||[];const v=parseInt(document.getElementById("gd").value);
    k.push({n:k.length+1,ended:today(),pages:readPages().length});
    S=Array(605).fill(null);G={days:(v>=1&&v<=365)?v:28,start:today(),k};save();render();
    toast("New khatam started — "+G.days+" days, "+Math.ceil(604/G.days)+" pages/day")};
  document.getElementById("gs").onclick=()=>{const v=parseInt(document.getElementById("gd").value);if(v>=1&&v<=365){G={days:v,start:today(),k:G.k||[]};save();render()}};
}
function render(){renderTop();renderNext();renderGoal();
  if(tab==="recap")renderRecap();else if(tab==="pages")renderPages();else if(tab==="surah")renderSurah();else renderBackup()}

document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));
  ["recap","pages","surah","backup"].forEach(id=>document.getElementById(id).classList.toggle("hide",id!==tab));render()});

try{if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
(function init(){
  try{const v=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(v)&&v.length===605)S=v}catch(e){}
  if(!S)S=defaults();
  try{const g=JSON.parse(localStorage.getItem(KEY+"-goal"));if(g&&g.days>0&&g.start)G=g}catch(e){}
  render();
  (async()=>{
    try{
      const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
      if(!db||!user)return;
      const id=await user.id();
      const ref=db.collection("data/users/"+id).doc("quran");
      const snapD=await ref.get();
      const data=snapD&&(snapD.data?snapD.data():snapD);
      if(data&&data.pages){try{const v=JSON.parse(data.pages);if(Array.isArray(v)&&v.length===605){S=v;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}}catch(e){}}
      if(data&&data.goal){try{const g=JSON.parse(data.goal);if(g&&g.days>0&&g.start)G=g}catch(e){}}
      dbDoc=ref;
      if(!(data&&data.pages))save();
      render();
    }catch(e){}
  })();
})();
</script>
